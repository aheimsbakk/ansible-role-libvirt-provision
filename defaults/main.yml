---
# Defaults to use system qemu socket since we use bridge for network.
libvirt_provision_connection: qemu:///system

# Folder to store temporary files and images
libvirt_provision_temp_path: /tmp

# Libvirt storage pool where to create virtual machine disk images.
libvirt_provision_storage_pool: default

# Create virtual machines on 'present', destroy on 'absent'.
state: present

# Define distros we automatically download and boot.
libvirt_provision_distros:
  trixie:
    url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2
    os_variant: debian13
    boot: uefi
  noble:
    url: https://cloud-images.ubuntu.com/minimal/daily/noble/current/noble-minimal-cloudimg-amd64.img
    os_variant: ubuntu24.04
    boot: none
  alma8:
    url: https://almalinux.uib.no/8/cloud/x86_64/images/AlmaLinux-8-GenericCloud-latest.x86_64.qcow2
    os_variant: almalinux8
    boot: none
  alma9:
    url: https://almalinux.uib.no/9/cloud/x86_64/images/AlmaLinux-9-GenericCloud-latest.x86_64.qcow2
    os_variant: almalinux9
    boot: menu=on
  alma10:
    url: https://almalinux.uib.no/10/cloud/x86_64_v2/images/AlmaLinux-10-GenericCloud-latest.x86_64_v2.qcow2
    os_variant: almalinux10
    boot: menu=on

# Default network config for a Debian/Ubuntu virtual machine.
# Machine can override everything.
libvirt_provision_virtual_machine_net_config:
  version: 2
  ethernets:
    enp1s0:
      dhcp4: true
      dhcp6: false

# Default virtual machine config.
# Virtual machines can override everything, even using more bridges.
libvirt_provision_virtual_machine_config:
  memory_mb: 1024
  disk_gb: 10
  vcpus: 2
  distro: trixie
  networks:
    - bridge: virbr0
      model:
        type: virtio

# Set default SSH key to use for connecting to machine as root.
libvirt_provision_root_ssh_key:

# Set default root password for connecting to machine as root.
libvirt_provision_root_password:

# Define virtual machines to create.
# Defaults to one machine without specific bridge or net_config.
libvirt_provision_virtual_machines:
  - name: my-trixie-vm
    distro: trixie
    networks:
