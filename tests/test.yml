---
- hosts: localhost
  remote_user: root
  roles:
    - role: ../..
      vars:
        libvirt_connection: qemu:///session
        libvirt_provision_root_ssh_key: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"
        libvirt_provision_root_password: root
