---
- name: Create three VMs for testing role
  hosts: localhost

  pre_tasks:
    - name: Set variables that need to be set on localhost
      ansible.builtin.set_fact:
        libvirt_provision_root_ssh_key: '{{ libvirt_provision_root_ssh_key | default(lookup("file", lookup("env", "HOME") + "/.ssh/id_ed25519.pub")) }}'
      delegate_to: localhost

  roles:
    - name: ../..
      vars:
        # Don't define password if you're working with remote VMs.
        # Then use only the SSH key. Keep safe.
        libvirt_provision_root_password: root
        libvirt_provision_temp_path: '{{ lookup("env", "HOME") + "/tmp" }}'
        libvirt_provision_virtual_machines:
          - name: trixie01
            memory_mb: 2000
            disk_gb: 20
            vcpus: 2
            distro: trixie
            net_config:
              ethernets:
                enp1s0:
                  addresses:
                    - 192.168.122.11/24
          - name: rocky01
            memory_mb: 2000
            distro: rocky10
            net_config:
              ethernets:
                ens3:
                  addresses:
                    - 192.168.122.12/24
          - name: ubuntu01
            distro: noble
            # Undefine networks, run with libvirt defaults
            networks:
