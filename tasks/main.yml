---
- name: Check if we have a valid temp folder
  ansible.builtin.stat:
    path: '{{ libvirt_provision_temp_path }}'
  register: folder_stat

- name: Create the the temp folder if it does not exists
  ansible.builtin.file:
    path: '{{ libvirt_provision_temp_path }}'
    state: directory
    mode: '0755'
  when: not folder_stat.stat.exists

- name: Combine default and custom config for VMs with network net_config
  ansible.builtin.set_fact:
    running_virtual_machines: "{{ running_virtual_machines | default([]) + [libvirt_provision_virtual_machine_config | combine(item)] }}"
  loop: "{{ libvirt_provision_virtual_machines }}"
  loop_control:
    label: '{{ item.name }}'
  when: item.net_config is defined and item.net_config != {}

- name: Combine default and custom config for the rest
  ansible.builtin.set_fact:
    running_virtual_machines: >-
      {{ running_virtual_machines | default([]) +
      [libvirt_provision_virtual_machine_config |
      combine(libvirt_provision_virtual_machine_net_config) | combine(item)] }}
  loop: "{{ libvirt_provision_virtual_machines }}"
  loop_control:
    label: '{{ item.name }}'
  when: item.net_config | default({}) == {}

- name: List existing domains, defined and running
  ansible.builtin.command:
    argv:
      - virsh
      - --connect
      - "{{ libvirt_provision_connection }}"
      - list
      - --all
      - --name
  register: existing_domains_raw
  changed_when: false

- name: Determine which virtual machines still need to be created
  ansible.builtin.set_fact:
    existing_domains: "{{ existing_domains_raw.stdout_lines | map('trim') | select | list }}"
    new_virtual_machines: >-
      {{ running_virtual_machines
         | rejectattr('name', 'in', existing_domains_raw.stdout_lines | map('trim') | select | list)
         | list }}

- name: Set temporary variables for cloud image information
  ansible.builtin.set_fact:
    cloud_image_name: "{{ libvirt_provision_distros[item.distro]['url'] | basename }}"
    cloud_image_url: "{{ libvirt_provision_distros[item.distro]['url'] }}"
    cloud_image_sha: "{{ libvirt_provision_distros[item.distro]['sha'] | default(omit) }}"
  loop: "{{ new_virtual_machines }}"
  loop_control:
    label: '{{ item.name }}'
  register: cloud_images_information

- name: Find unique cloud images to download, and ready to download
  ansible.builtin.set_fact:
    cloud_images_unique: "{{ cloud_images_information.results | map(attribute='ansible_facts') | unique | list }}"

- name: Download local copy of cloud images
  ansible.builtin.get_url:
    url: "{{ item.cloud_image_url }}"
    dest: "{{ libvirt_provision_temp_path }}/{{ item.cloud_image_name }}"
    mode: '0644'
    checksum: "{{ item.cloud_image_sha | default(omit) }}"
  loop: "{{ cloud_images_unique }}"
  loop_control:
    label: '{{ item.cloud_image_url }}'

- name: Create disk placeholder in storage pool
  ansible.builtin.command:
    argv:
      - virsh
      - --connect
      - "{{ libvirt_provision_connection }}"
      - vol-create-as
      - "{{ libvirt_provision_storage_pool }}"
      - "{{ item.name }}.qcow2"
      - "{{ item.disk_gb }}G"
      - --format
      - qcow2
  loop: "{{ new_virtual_machines }}"
  register: disk_placeholder
  loop_control:
    label: '{{ item.name }}.qcow2'
  ignore_errors: true
  failed_when: false
  changed_when: false
  when: state == "present"

- name: List new placeholders in storage pool
  ansible.builtin.command: echo
  loop: "{{ disk_placeholder.results }}"
  loop_control:
    label: '{{ item.item.name }}.qcow2'
  changed_when: true
  when:
    - state == "present"
    - item.rc == 0

- name: Import cloud image into placeholder
  ansible.builtin.command:
    argv:
      - virsh
      - --connect
      - "{{ libvirt_provision_connection }}"
      - vol-upload
      - "{{ item.item.name }}.qcow2"
      - "{{ libvirt_provision_temp_path }}/{{ libvirt_provision_distros[item.item.distro]['url'] | basename }}"
      - --sparse
      - --pool
      - "{{ libvirt_provision_storage_pool }}"
  loop: "{{ disk_placeholder.results }}"
  loop_control:
    label: '{{ item.item.name }}.qcow2'
  changed_when: true
  when:
    - state == "present"
    - item.rc == 0

- name: Resize VM disk
  ansible.builtin.command:
    argv:
      - virsh
      - --connect
      - "{{ libvirt_provision_connection }}"
      - vol-resize
      - "{{ item.item.name }}.qcow2"
      - "{{ item.item.disk_gb }}G"
      - --pool
      - "{{ libvirt_provision_storage_pool }}"
  loop: "{{ disk_placeholder.results }}"
  loop_control:
    label: '{{ item.item.name }}.qcow2'
  changed_when: true
  when:
    - state == "present"
    - item.rc == 0

- name: Create private build folder for cloud-init seed per virtual machine
  ansible.builtin.tempfile:
    state: directory
    path: '{{ libvirt_provision_temp_path }}'
    prefix: '{{ item.name }}-seed-'
  loop: "{{ new_virtual_machines }}"
  loop_control:
    label: '{{ item.name }}'
  register: seed_build_folders
  when: state == "present"

- name: Collect cloud-init seed build folders
  ansible.builtin.set_fact:
    seed_builds: "{{ seed_builds | default([]) + [{'vm': item.item, 'folder': item.path}] }}"
  loop: "{{ seed_build_folders.results }}"
  loop_control:
    label: '{{ item.item.name }}'
  when: state == "present"

- name: Build and upload cloud-init seed per virtual machine
  when: state == "present" and new_virtual_machines | length > 0
  block:
    - name: Create cloud-init user-data
      ansible.builtin.template:
        src: user-data.j2
        dest: '{{ item.folder }}/user-data'
        mode: '0600'
      loop: "{{ seed_builds }}"
      loop_control:
        label: '{{ item.vm.name }}'

    - name: Create cloud-init network-config
      ansible.builtin.template:
        src: network-config.j2
        dest: '{{ item.folder }}/network-config'
        mode: '0600'
      loop: "{{ seed_builds }}"
      loop_control:
        label: '{{ item.vm.name }}'
      when: item.vm.net_config is defined

    - name: Create cloud-init meta-data
      ansible.builtin.template:
        src: meta-data.j2
        dest: '{{ item.folder }}/meta-data'
        mode: '0600'
      loop: "{{ seed_builds }}"
      loop_control:
        label: '{{ item.vm.name }}'

    - name: Build cloud-init seed ISO
      ansible.builtin.command:
        cmd: >-
          xorriso -as mkisofs
          -output '{{ item.folder }}/seed.iso'
          -volid cidata -joliet -rock
          meta-data user-data{{ ' network-config' if item.vm.net_config is defined else '' }}
        chdir: '{{ item.folder }}'
      loop: "{{ seed_builds }}"
      loop_control:
        label: '{{ item.vm.name }}-seed.iso'
      changed_when: false

    - name: Get size of cloud-init seed ISO
      ansible.builtin.stat:
        path: '{{ item.folder }}/seed.iso'
      loop: "{{ seed_builds }}"
      loop_control:
        label: '{{ item.vm.name }}-seed.iso'
      register: seed_iso_stat

    - name: Create seed ISO placeholder in storage pool
      ansible.builtin.command:
        argv:
          - virsh
          - --connect
          - "{{ libvirt_provision_connection }}"
          - vol-create-as
          - "{{ libvirt_provision_storage_pool }}"
          - "{{ item.item.vm.name }}-seed.iso"
          - "{{ item.stat.size }}"
          - --format
          - raw
      loop: "{{ seed_iso_stat.results }}"
      loop_control:
        label: '{{ item.item.vm.name }}-seed.iso'
      register: seed_iso_placeholder
      ignore_errors: true
      failed_when: false
      changed_when: false

    - name: Upload cloud-init seed ISO into placeholder
      ansible.builtin.command:
        argv:
          - virsh
          - --connect
          - "{{ libvirt_provision_connection }}"
          - vol-upload
          - "{{ item.item.item.vm.name }}-seed.iso"
          - "{{ item.item.item.folder }}/seed.iso"
          - --pool
          - "{{ libvirt_provision_storage_pool }}"
      loop: "{{ seed_iso_placeholder.results }}"
      loop_control:
        label: '{{ item.item.item.vm.name }}-seed.iso'
      changed_when: true
      when: item.rc == 0

  always:
    - name: Remove private build folders for cloud-init seed
      ansible.builtin.file:
        path: '{{ item.folder }}'
        state: absent
      loop: "{{ seed_builds | default([]) }}"
      loop_control:
        label: '{{ item.vm.name }}'

- name: Create VMs
  community.libvirt.virt_install:
    uri: "{{ libvirt_provision_connection }}"
    name: "{{ item.name }}"
    memory: "{{ item.memory_mb }}"
    vcpus: "{{ item.vcpus }}"
    import: true
    osinfo:
      name: "{{ libvirt_provision_distros[item.distro]['os_variant'] }}"
    boot: "{{ libvirt_provision_distros[item.distro]['boot'] | default(omit) }}"
    disks:
      - vol: "{{ libvirt_provision_storage_pool }}/{{ item.name }}.qcow2"
        bus: virtio
        driver:
          discard: unmap
      - vol: "{{ libvirt_provision_storage_pool }}/{{ item.name }}-seed.iso"
        bus: virtio
        readonly: true
    networks: "{{ item.networks | default(omit) }}"
    graphics:
      type: none
    state: "{{ state }}"
  loop: "{{ running_virtual_machines }}"
  loop_control:
    label: '{{ item.name }}'
  register: cmd_virt_install
  failed_when: false

- name: Result of VM operation
  ansible.builtin.debug:
    msg: "{{ item.msg }}"
  loop: "{{ cmd_virt_install.results }}"
  loop_control:
    label: '{{ item.item.name }}'
  when:
    - item.msg is defined

- name: Undefine VMs
  community.libvirt.virt:
    uri: "{{ libvirt_provision_connection }}"
    name: "{{ item.name }}"
    command: undefine
    flags:
      - nvram
  loop: "{{ running_virtual_machines }}"
  loop_control:
    label: '{{ item.name }}'
  failed_when: false
  when: state == "absent"
